<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>go503: cuándo llega tu bus</title>
  <meta name="description" content="Mira cuánto tarda tu bus entre cada parada, en tiempo real.">
  <meta name="theme-color" content="#1B2559">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style  .css">
</head>
<body>

  <header class="top">
    <a class="logo" href="/" aria-label="go503, inicio">go503</a>
    <nav class="routes" aria-label="Rutas">
      <a href="#" data-ruta="101" aria-current="page">101</a>
      <a href="#" data-ruta="42">42</a>
      <a href="#" data-ruta="29">29</a>
    </nav>
  </header>

  <main class="app">

    <!-- Mapa esquemático: app.js dibuja dentro de #layer -->
    <section class="map" aria-label="Mapa de la ruta">
      <svg id="map-svg" viewBox="0 0 360 320" role="img" aria-label="Mapa de la ruta">
        <defs>
          <pattern id="blocks" width="85" height="75" patternUnits="userSpaceOnUse">
            <rect class="m-block" x="5" y="5" width="75" height="65" rx="10"/>
          </pattern>
        </defs>
        <rect width="360" height="320" fill="url(#blocks)"/>
        <!-- Volcán de San Salvador, de fondo -->
        <path class="m-volcan" d="M150 320 L218 236 Q226 228 236 236 L246 244 L262 232 Q270 228 278 236 L350 320 Z"/>
        <path class="m-water" d="M-10 215 C 80 190, 150 250, 230 225 S 330 180, 370 200"/>
        <g id="layer"></g>
      </svg>
    </section>

    <div class="panel">
      <p id="status" class="status" role="status" hidden></p>

      <section class="next" aria-labelledby="next-stop">
        <div>
          <h1 class="next__stop" id="next-stop">Cargando...</h1>
          <p class="next__eta" id="next-eta"></p>
        </div>
        <span class="fascia" id="fascia">101</span>
        <p class="next__upd" id="upd"></p>
      </section>

      <section class="stops" aria-labelledby="stops-title">
        <h2 id="stops-title">Paradas de la ruta</h2>
        <ol id="stops-list"></ol>
      </section>

      <p class="foot">Hecho en El Salvador</p>
    </div>

  </main>

  <script src="app.js" defer></script>
</body>
</html>
