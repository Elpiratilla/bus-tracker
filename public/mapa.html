<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go503</title>
  <meta name="description" content="Mira cuánto tarda tu bus entre cada parada, en tiempo real.">
  <meta name="theme-color" content="#1B2559">
  <!-- Tema elegido por la persona (claro/oscuro), antes de pintar para que no parpadee -->
  <script>try { const t = localStorage.getItem("go503-tema"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="go503">
  <link rel="icon" href="/img/go503-favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/icono-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
</head>
<body>

  <!-- Iconos de unidad -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-bus" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M3 11h18" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="8" cy="14.5" r="1.3" fill="currentColor"/>
      <circle cx="16" cy="14.5" r="1.3" fill="currentColor"/>
      <path d="M6.5 18v3M17.5 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24">
      <path d="M3 11l9-7 9 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5.5 9.5V20h13V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 20v-5.5h4V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-micro" viewBox="0 0 24 24">
      <path d="M2 16V8a2 2 0 0 1 2-2h9l5 5h2a2 2 0 0 1 2 2v3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M13 6v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="7" cy="17.5" r="2.2" fill="currentColor"/>
      <circle cx="17" cy="17.5" r="2.2" fill="currentColor"/>
    </symbol>
  </svg>

  <main class="app">

    <section class="stage">
      <header class="top">
        <a class="home" href="/" aria-label="Volver al inicio">
          <svg class="ico" aria-hidden="true"><use href="#i-home"/></svg>
          <span class="home__text">Inicio</span>
        </a>
        <a class="logo" href="/" aria-label="go503, inicio">
          <img class="logo--claro" src="/img/go503-logo-claro.svg" alt="" width="28" height="32">
          <img class="logo--oscuro" src="/img/go503-logo-oscuro.svg" alt="" width="28" height="32">
        </a>
        <div class="search" role="search">
          <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
          <label class="visually-hidden" for="buscar">Buscar ruta o parada</label>
          <input id="buscar" type="search" placeholder="Busca tu ruta o parada" autocomplete="off" spellcheck="false" enterkeyhint="search">
        </div>
        <button class="theme" id="tema" type="button" aria-label="Cambiar a modo oscuro">
          <svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
      </header>
      <div class="row2">
        <div class="seg" role="group" aria-label="Tipo de unidad">
          <button type="button" data-tipo="todos" aria-pressed="true">Todos</button>
          <button type="button" data-tipo="autobus" aria-pressed="false">Autobús</button>
          <button type="button" data-tipo="microbus" aria-pressed="false">Microbús</button>
        </div>
        <nav class="chips" id="chips" aria-label="Rutas"></nav>
      </div>
      <!-- Mapa real: Leaflet + mosaicos de CARTO. app.js dibuja aquí -->
      <div id="map" role="region" aria-label="Mapa de la ruta"></div>
    </section>

    <div class="panel">
      <p id="status" class="status" role="status" hidden></p>

      <div class="dir" id="sentidos" role="group" aria-label="Sentido de la ruta" hidden></div>

      <section class="next" aria-labelledby="next-stop">
        <div>
          <h1 class="next__stop" id="next-stop">Cargando...</h1>
          <p class="next__eta" id="next-eta"></p>
        </div>
        <span class="fascia" id="fascia">101</span>
        <p class="next__upd" id="upd"></p>
      </section>

      <section class="stops" aria-labelledby="stops-title">
        <h2 id="stops-title">Paradas de la ruta</h2>
        <ol id="stops-list"></ol>
      </section>

      <p class="foot">Hecho en El Salvador</p>
    </div>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
